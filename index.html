<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starsong | Procedural Space Exploration Game in the Browser</title>
    <meta name="description" content="A free space exploration game for the browser. Land on procedural planets, fly between them without loading screens and warp across 24,000 star systems." />
    <link rel="canonical" href="https://spacegame.ajarvis.co/" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Starsong" />
    <meta property="og:title" content="Starsong | Procedural Space Exploration Game" />
    <meta property="og:description" content="A free space exploration game for the browser. Land on procedural planets, fly between them without loading screens and warp across 24,000 star systems." />
    <meta property="og:url" content="https://spacegame.ajarvis.co/" />
    <meta property="og:image" content="https://spacegame.ajarvis.co/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Starsong title screen with a ringed planet" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Starsong",
        "url": "https://spacegame.ajarvis.co/",
        "description": "A free space exploration game for the browser. Land on procedural planets, fly between them without loading screens and warp across 24,000 star systems.",
        "image": "https://spacegame.ajarvis.co/og-image.jpg",
        "genre": ["Space exploration", "Sandbox"],
        "gamePlatform": "Web browser",
        "applicationCategory": "GameApplication",
        "playMode": "SinglePlayer",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": { "@type": "Person", "name": "jarvisar", "url": "https://github.com/jarvisar" }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>
    <!-- Readable without JavaScript or WebGL. Hidden once the game starts. -->
    <main id="about">
      <h1>Starsong</h1>
      <p>A free space exploration game for the browser. Land on procedural planets, fly between them without loading screens and follow a signal across a galaxy of 24,000 star systems toward its core.</p>
      <p>Needs a desktop browser with WebGL2 and a mouse and keyboard.</p>
      <noscript><p>JavaScript is turned off, so the game can't start.</p></noscript>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
